version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - BIGCHAINDB_ROOT_URL=http://bigchaindb:9984
      - MONGODB_URL=mongodb://mongodb:27017
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET_KEY=dev-secret-change-in-production
    depends_on:
      - bigchaindb
      - mongodb
      - rabbitmq
    networks:
      - agri-network
    restart: unless-stopped

  bigchaindb:
    image: bigchaindb/bigchaindb:2.2.2
    ports:
      - "9984:9984"
      - "9985:9985"
    environment:
      - BIGCHAINDB_DATABASE_HOST=mongodb
      - BIGCHAINDB_DATABASE_PORT=27017
      - BIGCHAINDB_SERVER_BIND=0.0.0.0:9984
      - BIGCHAINDB_WSSERVER_HOST=0.0.0.0
      - BIGCHAINDB_WSSERVER_PORT=9985
      - BIGCHAINDB_TENDERMINT_HOST=tendermint
      - BIGCHAINDB_TENDERMINT_PORT=26657
    depends_on:
      - mongodb
      - tendermint
    networks:
      - agri-network
    restart: unless-stopped

  tendermint:
    image: tendermint/tendermint:v0.31.5
    ports:
      - "26656:26656"
      - "26657:26657"
    entrypoint: ''
    command: sh -c "tendermint init && tendermint node --consensus.create_empty_blocks=false --proxy_app=tcp://bigchaindb:26658"
    networks:
      - agri-network
    restart: unless-stopped

  mongodb:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - agri-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.11-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - agri-network
    restart: unless-stopped

networks:
  agri-network:
    driver: bridge

volumes:
  mongodb_data:
  rabbitmq_data:
